<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PolyCipher{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo PolyCipher" width="32" height="32">
    <h1><a href="{{ url_for('main.index') }}">PolyCipher</a></h1>
    <nav>
      <a href="{{ url_for('hill.index') }}">Hill</a>
      <a href="{{ url_for('playfair.index') }}">Playfair</a>
      <a href="{{ url_for('cryptanalysis.hill') }}">Cryptanalyse Hill</a>
      <a href="{{ url_for('cryptanalysis.playfair') }}">Cryptanalyse Playfair</a>
      <a href="{{ url_for('main.history') }}">Historique</a>
      <a href="{{ url_for('main.documentation') }}">Documentation</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
